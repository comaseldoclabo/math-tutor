services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mathtutor
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: mathtutor
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathtutor"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mathtutor:change-me@db:5432/mathtutor
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
volumes:
  pgdata:
